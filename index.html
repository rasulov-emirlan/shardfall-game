<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0810" />
<title>Shardfall</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>✦</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="bars">
      <div class="bar hp"><div id="hpFill" class="fill"></div><span id="hpText" class="bartext">60/60</span></div>
      <div class="bar xp"><div id="xpFill" class="fill"></div></div>
    </div>
    <div class="hud-right">
      <canvas id="minimap" width="58" height="58"></canvas>
      <div id="lvl">LV 1</div>
      <div id="floor">Floor 1</div>
      <div id="shards" class="shards">◇◇◇◇◇</div>
      <div id="gold" class="gold">0g</div>
    </div>
  </div>
  <div id="btnPause" class="topbtn">⏸</div>
  <div id="mute" class="mute">🔊</div>

  <!-- Boss bar -->
  <div id="boss" class="hidden">
    <div id="bossName">Boss</div>
    <div class="bar bosshp"><div id="bossFill" class="fill"></div></div>
  </div>

  <!-- Touch controls -->
  <div id="controls">
    <div id="joystick"><div id="knob"></div></div>
    <div class="btn-cluster">
      <div id="btnB" class="btn small">B</div>
      <div id="btnDash" class="btn dash">⟫</div>
      <div id="btnA" class="btn big">A</div>
    </div>
    <div id="btnInv" class="invbtn">🎒</div>
  </div>

  <!-- consumable quick-bar -->
  <div id="consumables" class="consumables"></div>
  <!-- active status / buffs -->
  <div id="statusbar" class="statusbar"></div>

  <!-- Dialog -->
  <div id="dialog" class="hidden"><div id="dialogText"></div><div class="tap-hint">tap to continue ▸</div></div>

  <!-- Inventory -->
  <div id="inventory" class="hidden">
    <div class="inv-panel">
      <div class="inv-head"><h2>Gear</h2><button id="invClose">✕</button></div>
      <div id="totals" class="totals"></div>
      <div class="inv-label">Equipped</div>
      <div id="equipped" class="equipped"></div>
      <div class="inv-label">Backpack</div>
      <div id="backpack" class="backpack"></div>
      <div class="inv-label">Codex</div>
      <div id="codex" class="codex"></div>
    </div>
  </div>

  <!-- Shop (Sanctum merchant) -->
  <div id="shop" class="hidden">
    <div class="modal-panel">
      <div class="modal-head"><h2>Merchant</h2><span id="shopGold" class="gold">0g</span></div>
      <div id="shopList" class="modal-list"></div>
      <div class="modal-btns">
        <button id="shopReroll">Reroll wares</button>
        <button id="shopClose" class="primary">Leave</button>
      </div>
    </div>
  </div>

  <!-- Forge (Sanctum anvil) -->
  <div id="forge" class="hidden">
    <div class="modal-panel">
      <div class="modal-head"><h2>Forge</h2><span id="forgeGold" class="gold">0g</span></div>
      <p class="modal-sub">Reforge equipped gear — pour gold into its stats.</p>
      <div id="forgeList" class="modal-list"></div>
      <div class="modal-btns"><button id="forgeClose" class="primary">Leave</button></div>
    </div>
  </div>

  <!-- Boss reward: choose one -->
  <div id="lootchoice" class="hidden">
    <div class="loot-panel">
      <h2>Spoils of the Fallen</h2>
      <p class="loot-sub">Choose one. Your wounds close as you take it.</p>
      <div id="lootList" class="loot-list"></div>
    </div>
  </div>

  <!-- Pause menu -->
  <div id="pause" class="hidden">
    <div class="pause-panel">
      <h2>PAUSED</h2>
      <div id="pauseBody" class="pause-body"></div>
      <div class="pause-actions">
        <button id="pauseResume" class="primary">Resume</button>
        <button id="pauseAbandon">Abandon run</button>
      </div>
    </div>
  </div>

  <!-- Overlay (title / death / win) -->
  <div id="overlay" class="hidden">
    <div class="ov-card">
      <h1 id="ovTitle">SHARDFALL</h1>
      <p id="ovBody"></p>
      <div class="ov-btns">
        <button id="ovBtn">New Game</button>
        <button id="ovBtn2" class="hidden">Continue</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
