server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ES modules need correct MIME; nginx:alpine handles .js as text/javascript.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # no caching during preview so updates show immediately
  add_header Cache-Control "no-store";
}
